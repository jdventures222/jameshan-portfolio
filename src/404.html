<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1D4ED8">
  <meta name="color-scheme" content="light">
  <meta name="robots" content="noindex">
  <title>Page not found · James Han</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="preload" href="/fonts/figtree/figtree-normal-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="not-found-page">
    <header class="not-found-header container">
      <p class="wordmark">{{person.name}}</p>
      <p class="location">{{person.area}}</p>
    </header>
    <main id="main" class="not-found container" tabindex="-1">
      <h1 id="not-found-title">Page not found</h1>
      <p>This address isn’t part of the site. The home page has the work, the services and my email.</p>
      <p><a class="button button-primary" href="/">Go to the home page</a></p>
    </main>
    <footer class="site-footer">
      <p class="container">{{person.name}} · {{person.area}} · No page builder, no trackers. · © {{updated|year}}</p>
    </footer>
  </div>
</body>
</html>
